version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsesync-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsesync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsesync_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-pulsesync_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsesync -d pulsesync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pulsesync-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsesync-backend
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: pulsesync
      POSTGRES_PASSWORD: pulsesync_secure_password
      POSTGRES_DB: pulsesync_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-pulsesync_super_secret_jwt_key_development_change_in_production_2026}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      - report_storage:/app/storage

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulsesync-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info
    restart: always
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: pulsesync
      POSTGRES_PASSWORD: pulsesync_secure_password
      POSTGRES_DB: pulsesync_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: ${SECRET_KEY:-pulsesync_super_secret_jwt_key_development_change_in_production_2026}
    depends_on:
      - postgres
      - redis
      - backend
    volumes:
      - ./backend:/app
      - report_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulsesync-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  report_storage:
